name: WishingASR quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install QA dependency
        run: python -m pip install -r requirements-qa.txt

      - name: Run content quality checks
        run: python qa_content_quality.py

      - name: Run static checks
        run: |
          python qa_static.py
          python qa_security_static.py

      - name: Run feature regression suites
        shell: bash
        run: |
          set -euo pipefail
          for test_file in qa_*.cjs; do
            echo "Running ${test_file}"
            node "${test_file}"
          done
